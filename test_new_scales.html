<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { background: #070a12; color: #fff; font-family: sans-serif; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.card { width: 350px; text-align: center; }
.frame {
  width: 350px;
  height: 380px;
  border-radius: 38px;
  background: radial-gradient(ellipse at 50% 28%, #0369a1 0%, #0c2d48 45%, #07111e 90%, #050b14 100%);
  border: 1.5px solid rgba(56, 189, 248, 0.45);
  overflow: hidden;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}
.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.8));
}
.s1 { object-position: center 10%; transform: scale(1.35); transform-origin: center 15%; }
.s2 { object-position: center 10%; transform: scale(1.48); transform-origin: center 15%; }
.s3 { object-position: center 9%; transform: scale(1.58); transform-origin: center 14%; }
.s4 { object-position: center 8%; transform: scale(1.70); transform-origin: center 12%; }
</style>
</head>
<body>
  <div class="card"><h3>Scale 1.35</h3><div class="frame"><img src="assets/images/me/profile.png" class="s1"></div></div>
  <div class="card"><h3>Scale 1.48</h3><div class="frame"><img src="assets/images/me/profile.png" class="s2"></div></div>
  <div class="card"><h3>Scale 1.58</h3><div class="frame"><img src="assets/images/me/profile.png" class="s3"></div></div>
  <div class="card"><h3>Scale 1.70</h3><div class="frame"><img src="assets/images/me/profile.png" class="s4"></div></div>
</body>
</html>
