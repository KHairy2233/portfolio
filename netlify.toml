# Netlify Configuration for Mahmoud Khairy Static Portfolio
# Pure HTML5, CSS3, Vanilla JavaScript (ES6+)

[build]
  # Directory to publish (root contains index.html, project.html, assets, cv, 404.html)
  publish = "."
  # No build command required for standard static website
  command = ""

# Global Security & Content Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# HTML Files: Instant updates, zero stale cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# JSON Data: UTF-8 charset
[[headers]]
  for = "/assets/data/projects.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Static Assets (Images, CSS, JS): Long-term cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Curriculum Vitae Assets
[[headers]]
  for = "/cv/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Custom 404 redirect rule (does not hijack existing pages)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
