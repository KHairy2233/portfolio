<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body {
  background-color: #070a12;
  color: #fff;
  font-family: sans-serif;
  margin: 0;
  padding: 80px 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  box-sizing: border-box;
}

.portrait-composition {
  position: relative;
  width: 350px;
  height: 380px;
}

.portrait-glow {
  position: absolute;
  inset: -30px;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(14, 165, 233, 0.12) 45%, transparent 70%);
  border-radius: 50%;
  filter: blur(35px);
  z-index: 1;
}

.decor-card-left {
  position: absolute;
  width: 300px;
  height: 340px;
  left: -32px;
  top: 15px;
  border-radius: 36px;
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.5) 0%, rgba(3, 105, 161, 0.28) 60%, rgba(15, 23, 42, 0.7) 100%);
  border: 1px solid rgba(56, 189, 248, 0.3);
  transform: rotate(-8deg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(14, 165, 233, 0.15);
  z-index: 2;
}

.decor-card-right {
  position: absolute;
  width: 270px;
  height: 300px;
  right: -28px;
  bottom: 12px;
  border-radius: 32px;
  background: linear-gradient(225deg, rgba(56, 189, 248, 0.35) 0%, rgba(2, 132, 199, 0.18) 55%, rgba(15, 23, 42, 0.7) 100%);
  border: 1px solid rgba(56, 189, 248, 0.25);
  transform: rotate(6deg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.12);
  z-index: 2;
}

.portrait-main-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 38px;
  background: radial-gradient(ellipse at 50% 28%, #0369a1 0%, #0c2d48 45%, #07111e 90%, #050b14 100%);
  border: 1.5px solid rgba(56, 189, 248, 0.45);
  box-shadow: 
    0 25px 50px rgba(0, 0, 0, 0.7),
    0 0 35px rgba(56, 189, 248, 0.22);
  z-index: 3;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.portrait-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 10%;
  transform: scale(1.48);
  transform-origin: center 15%;
  filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.8));
  display: block;
}

.floating-pill {
  position: absolute;
  z-index: 5;
  padding: 0.65rem 1.15rem;
  background: rgba(13, 18, 31, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 9999px;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.2);
  font-size: 0.8rem;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
}

.floating-pill-1 {
  top: 25px;
  left: -40px;
}

.floating-pill-2 {
  bottom: 25px;
  right: -36px;
}

.pill-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.pill-dot-cyan {
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
}

.pill-dot-emerald {
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
}
</style>
</head>
<body>
  <div class="portrait-composition">
    <div class="portrait-glow"></div>
    <div class="decor-card-left"></div>
    <div class="decor-card-right"></div>
    <div class="portrait-main-frame">
      <img src="assets/images/me/profile.png" alt="Mahmoud Khairy - Data Analyst" class="portrait-img">
    </div>
    <div class="floating-pill floating-pill-1">
      <span class="pill-dot pill-dot-cyan"></span>
      <span>Power BI & DAX</span>
    </div>
    <div class="floating-pill floating-pill-2">
      <span class="pill-dot pill-dot-emerald"></span>
      <span>SQL Server & Python</span>
    </div>
  </div>
</body>
</html>
